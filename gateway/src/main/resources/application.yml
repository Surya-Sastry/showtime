server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: identity
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /$\{segment}
        - id: catalog
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/movies/**,/api/v1/shows/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /$\{segment}
        - id: booking
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/holds/**,/api/v1/bookings/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /$\{segment}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
