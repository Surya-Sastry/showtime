name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Docker is preinstalled on GitHub-hosted ubuntu-latest runners, which
      # is all every module's integration tests need: they each spin up
      # their own Postgres/Redis via Testcontainers rather than relying on
      # a shared `services:` container, so no extra setup is required here.
      - name: Build and test every module
        run: mvn -B clean install
      - name: Publish surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*"
          retention-days: 7
