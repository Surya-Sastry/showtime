server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DATABASE_URL:jdbc:postgresql://localhost:5435/booking}
    username: ${BOOKING_DATABASE_USER:booking}
    password: ${BOOKING_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

grpc:
  client:
    catalog-service:
      address: ${CATALOG_GRPC_ADDRESS:static://localhost:9082}
      negotiation-type: plaintext

showtime:
  hold:
    ttl-seconds: 300
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET:}
  jwt:
    signing-key: ${JWT_SIGNING_KEY:}
    issuer: showtime-identity

resilience4j:
  circuitbreaker:
    instances:
      catalog:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
      payment:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    instances:
      # Catalog's two RPCs are pure reads, so bounded retries are safe here.
      # There is no "retry" config for payment: creating a payment attempt
      # is not idempotent to blindly repeat, so it is never retried.
      catalog:
        max-attempts: 3
        wait-duration: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
