server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DATABASE_URL:jdbc:postgresql://localhost:5433/identity}
    username: ${IDENTITY_DATABASE_USER:identity}
    password: ${IDENTITY_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

showtime:
  jwt:
    signing-key: ${JWT_SIGNING_KEY:}
    issuer: showtime-identity
    access-token-ttl-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
